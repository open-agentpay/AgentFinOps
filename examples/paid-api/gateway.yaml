# AgentFinOps Gateway Configuration
# Specification version: 2.1.0

version: "2.1.0"

server:
  host: "0.0.0.0"
  port: 8000
  db_path: "./data/gateway.db"
  default_timeout_seconds: 10.0
  audit_log_path: "./data/audit.log"

settlement:
  adapter: "quota"
  default_network: "internal:quota"
  default_asset_symbol: "CREDITS"
  default_asset_decimals: 2
  default_challenge_ttl_seconds: 120
  safe_buffer_seconds: 60
  default_pay_to: "tenant_primary"

routes:
  # Market data ticker endpoint (0.01 Credits)
  - path: /v1/market-data
    upstream: "${UPSTREAM_MARKET_URL:-http://127.0.0.1:9000/market-data}"
    price: "0.01 CREDITS"
    methods:
      - GET
    challenge_ttl_seconds: 60

  # High-depth orderbook streaming endpoint (0.05 Credits)
  - path: /v1/market-data/depth
    upstream: "${UPSTREAM_DEPTH_URL:-http://127.0.0.1:9000/depth}"
    price: "0.05 CREDITS"
    methods:
      - GET
    challenge_ttl_seconds: 30

  # AI Inference Execution (0.20 Credits)
  - path: /v1/ai/infer
    upstream: "${UPSTREAM_AI_URL:-http://127.0.0.1:9002/v1/chat/completions}"
    price: "0.20 CREDITS"
    methods:
      - POST
    timeout_seconds: 60.0
    strip_path_prefix: true
    upstream_headers:
      X-Internal-Secret: "${INTERNAL_SERVICE_SECRET:-local-dev-secret}"
