name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AGENTPAY_JWT_SECRET: "ci-test-jwt-secret-key-at-least-32-characters-long"
  AGENTPAY_UPSTREAM_MASTER_KEY: "0123456789abcdef0123456789abcdef"

jobs:
  gateway-go-test:
    name: Go Gateway Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/gateway/go.sum

      - name: Build Go Gateway
        run: |
          make gateway-build

      - name: Run Go Gateway Tests
        run: |
          make gateway-test

  frontend-test:
    name: Frontend Test (Console & Portal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Test Console
        working-directory: apps/console
        run: |
          pnpm test

      - name: Lint Portal
        working-directory: apps/marketplace-web
        run: |
          pnpm lint
