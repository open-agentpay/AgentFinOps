# ==============================================================================
# AgentPay Production Compose Specification with Caddy Edge Gateway
# Uses `caddy:alpine` as the unified reverse proxy with automatic SSL/TLS.
#
# Usage:
#   docker compose -f docker-compose.caddy.yml up -d
# ==============================================================================

services:
  # ==============================================================================
  # 0. Edge Gateway & SSL Reverse Proxy (Caddy)
  # Automatically obtains and renews HTTPS certificates from Let's Encrypt / ZeroSSL
  # ==============================================================================
  caddy:
    image: caddy:alpine
    container_name: agentfinops-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    environment:
      DOMAIN_MARKETPLACE: ${DOMAIN_MARKETPLACE:-aipmedia.cn}
      DOMAIN_CONSOLE: ${DOMAIN_CONSOLE:-console.aipmedia.cn}
      DOMAIN_GATEWAY: ${DOMAIN_GATEWAY:-gate.aipmedia.cn}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # Crucial: persists SSL certificates & keys
      - caddy_config:/config  # Persists dynamic Caddy runtime state
    depends_on:
      - gateway
      - console
      - marketplace
    networks:
      - agentfinops-net

  # ==============================================================================
  # 1. PostgreSQL 15 Database (Relational Store)
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: agentfinops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentfinops}
      POSTGRES_USER: ${POSTGRES_USER:-agentfinops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Bound only to local loopback interface for host maintenance; not exposed to public
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentfinops-net

  # ==============================================================================
  # 2. AgentFinOps Go Gateway Service (Core Payment Proxy & Admin API)
  # ==============================================================================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    platform: linux/amd64
    image: ${DOCKER_REGISTRY:-openagentpay}/agentfinops-gateway:${IMAGE_TAG:-latest}
    container_name: agentfinops-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/gateway/configs/gateway.example.yaml:/etc/agentfinops/gateway.yaml:ro
      - ./certs/apiclient_key.pem:/etc/agentfinops/certs/apiclient_key.pem:ro
    environment:
      AGENTPAY_HOST: "0.0.0.0"
      AGENTPAY_PORT: 8000
      AGENTPAY_POSTGRES_URL: "postgres://${POSTGRES_USER:-agentfinops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-agentfinops}?sslmode=disable"
      AGENTPAY_JWT_SECRET: ${AGENTPAY_JWT_SECRET:?AGENTPAY_JWT_SECRET must be set}
      AGENTPAY_UPSTREAM_MASTER_KEY: ${AGENTPAY_UPSTREAM_MASTER_KEY:?AGENTPAY_UPSTREAM_MASTER_KEY must be set}
      AGENTPAY_FACILITATOR_API_KEY: ${AGENTPAY_FACILITATOR_API_KEY:-}
      AGENTPAY_LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENTPAY_LOG_FORMAT: "json"
      WECHAT_PAY_APPID: ${WECHAT_PAY_APPID:-}
      WECHAT_PAY_MCHID: ${WECHAT_PAY_MCHID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-/etc/agentfinops/certs/apiclient_key.pem}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentfinops-net

  # ==============================================================================
  # 3. AgentFinOps Console (Web Dashboard: Vue 3 + Vite)
  # ==============================================================================
  console:
    build:
      context: ./apps/console
      dockerfile: Dockerfile
    platform: linux/amd64
    image: ${DOCKER_REGISTRY:-openagentpay}/agentfinops-console:${IMAGE_TAG:-latest}
    container_name: agentfinops-console
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./apps/console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/console/dist:/usr/share/nginx/html:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentfinops-net

  # ==============================================================================
  # 4. AgentFinOps Marketplace Web (Storefront & GEO Portal: Next.js 15)
  # ==============================================================================
  marketplace:
    build:
      context: ./apps/marketplace-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-https://gate.aipmedia.cn}
        NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL:-https://console.aipmedia.cn}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://aipmedia.cn}
    platform: linux/amd64
    image: ${DOCKER_REGISTRY:-openagentpay}/agentfinops-marketplace:${IMAGE_TAG:-latest}
    container_name: agentfinops-marketplace
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      GATEWAY_INTERNAL_URL: http://gateway:8000
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-https://gate.aipmedia.cn}
      NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL:-https://console.aipmedia.cn}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://aipmedia.cn}
    expose:
      - "3000"
    volumes:
      - ./apps/marketplace-web/public/docs:/app/public/docs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentfinops-net

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  agentfinops-net:
    driver: bridge
