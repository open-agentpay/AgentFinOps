services:
  # ==============================================================================
  # 1. PostgreSQL 15 Database (Relational Store for Tenants, Wallets, Routes, Audit)
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: agentfinops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentfinops}
      POSTGRES_USER: ${POSTGRES_USER:-agentfinops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentfinops_strong_password_change_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentfinops-net

  # ==============================================================================
  # 2. AgentPay Go Gateway Service (Core Payment Proxy & Admin API)
  # ==============================================================================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-openagentpay}/agentfinops-gateway:${IMAGE_TAG:-latest}
    container_name: agentfinops-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/gateway/configs/gateway.example.yaml:/etc/agentfinops/gateway.yaml:ro
    environment:
      AGENTPAY_HOST: "0.0.0.0"
      AGENTPAY_PORT: 8000
      AGENTPAY_POSTGRES_URL: "postgres://${POSTGRES_USER:-agentfinops}:${POSTGRES_PASSWORD:-agentfinops_strong_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-agentfinops}?sslmode=disable"
      AGENTPAY_JWT_SECRET: ${AGENTPAY_JWT_SECRET:-agentfinops-super-secret-production-jwt-key-32chars!}
      AGENTPAY_UPSTREAM_MASTER_KEY: ${AGENTPAY_UPSTREAM_MASTER_KEY:-}
      AGENTPAY_LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENTPAY_LOG_FORMAT: "json"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentfinops-net

  # ==============================================================================
  # 3. AgentPay Console (Web Management Dashboard: Vue 3 + Element Plus + Nginx)
  # ==============================================================================
  console:
    build:
      context: ./apps/console
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-openagentpay}/agentfinops-console:${IMAGE_TAG:-latest}
    container_name: agentfinops-console
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentfinops-net

  # ==============================================================================
  # 4. AgentPay Marketplace Web (Storefront & GEO Portal: Next.js 15)
  # ==============================================================================
  marketplace:
    build:
      context: ./apps/marketplace-web
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-openagentpay}/agentfinops-marketplace:${IMAGE_TAG:-latest}
    container_name: agentfinops-marketplace
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      GATEWAY_INTERNAL_URL: http://gateway:8000
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8000}
      NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    ports:
      - "${MARKETPLACE_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - agentfinops-net

  # ==============================================================================
  # 5. Optional Upstream Mock API (Simulates upstream LLM/Web2 API)
  # ==============================================================================
  upstream-api:
    image: python:3.12-alpine
    container_name: agentfinops-upstream-api
    restart: unless-stopped
    command: >
      sh -c "python -m http.server 9000"
    expose:
      - "9000"
    # If you need to access upstream directly from host, map to a non-conflicting port:
    # ports:
    #   - "${UPSTREAM_PORT:-19000}:9000"
    networks:
      - agentfinops-net

volumes:
  postgres_data:
    driver: local

networks:
  agentfinops-net:
    driver: bridge
