    <!-- Channel Attribution & UTM Tracking -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var keys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'channel', 'ref'];
          var attribution = {};
          var hasUtm = false;
          for (var i = 0; i < keys.length; i++) {
            var val = params.get(keys[i]);
            if (val) {
              attribution[keys[i]] = val;
              hasUtm = true;
            }
          }
          if (document.referrer && !attribution.referrer) {
            attribution.referrer = document.referrer;
            hasUtm = true;
          }
          if (hasUtm) {
            attribution.captured_at = new Date().toISOString();
            localStorage.setItem('agentpay_attribution', JSON.stringify(attribution));
            sessionStorage.setItem('agentpay_attribution_session', JSON.stringify(attribution));
          }
        } catch (e) {}
      })();
    </script>

  <body>
